<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05080f"/>
      <stop offset="55%" stop-color="#0a1424"/>
      <stop offset="100%" stop-color="#071a1c"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e6fbff"/>
      <stop offset="50%" stop-color="#5ee7ff"/>
      <stop offset="100%" stop-color="#39ff9c"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#1b2a3d" stroke-width="0.6"/>
    </pattern>
    <radialGradient id="glow" cx="0.82" cy="0.5" r="0.35">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="neon" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .trace  { fill:none; stroke:#163247; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; }
      .pulse  { fill:none; stroke-width:2.6; stroke-linecap:round; stroke-linejoin:round;
                stroke-dasharray:28 900; animation:flow 4.5s linear infinite; }
      .c1 { stroke:#00e5ff; }
      .c2 { stroke:#39ff9c; animation-duration:5.5s; animation-delay:-1.5s; }
      .c3 { stroke:#00e5ff; animation-duration:6.5s; animation-delay:-3s; }
      .c4 { stroke:#39ff9c; animation-duration:3.8s; animation-delay:-0.7s; }
      @keyframes flow { from { stroke-dashoffset:928; } to { stroke-dashoffset:0; } }

      .via { fill:#0a1424; stroke:#2fd6ff; stroke-width:2; animation:blink 2.6s ease-in-out infinite; }
      .via.d1 { animation-delay:-0.6s; } .via.d2 { animation-delay:-1.3s; } .via.d3 { animation-delay:-2s; }
      @keyframes blink { 0%,100% { opacity:.35; } 50% { opacity:1; } }

      .name { font: 800 54px 'Segoe UI', 'Helvetica Neue', Ubuntu, Arial, sans-serif; letter-spacing:2px;
              animation:rise 1.2s ease-out both; }
      .role { font: 600 19px 'Segoe UI', Ubuntu, Arial, sans-serif; fill:#9fb3c8; letter-spacing:3px;
              animation:rise 1.2s .25s ease-out both; }
      .term { font: 500 17px 'Cascadia Code', 'Fira Code', Consolas, 'Courier New', monospace; fill:#39ff9c;
              animation:rise 1.2s .5s ease-out both; }
      .prompt { fill:#5ee7ff; }
      .cursor { fill:#39ff9c; animation:cur 1s steps(1) infinite; }
      @keyframes cur { 50% { opacity:0; } }
      @keyframes rise { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }

      .chip  { fill:#0b1726; stroke:#2fd6ff; stroke-width:2; }
      .core  { fill:none; stroke:#39ff9c; stroke-width:1.4; stroke-dasharray:4 4; animation:spin 12s linear infinite;
               transform-origin:1010px 160px; }
      @keyframes spin { to { transform:rotate(360deg); } }
      .pin   { stroke:#5ee7ff; stroke-width:3; stroke-linecap:round; }
      .chipT { font: 700 20px 'Cascadia Code', Consolas, monospace; fill:#e6fbff; letter-spacing:2px; }
      .chipS { font: 600 11px 'Cascadia Code', Consolas, monospace; fill:#39ff9c; letter-spacing:3px; }
      .wave  { fill:none; stroke:#5ee7ff; stroke-width:2.2; stroke-linecap:round; opacity:0;
               animation:wave 2.4s ease-out infinite; }
      .w2 { animation-delay:.4s; } .w3 { animation-delay:.8s; }
      @keyframes wave { 0% { opacity:0; } 30% { opacity:1; } 100% { opacity:0; } }
      .lora { font: 700 11px 'Cascadia Code', Consolas, monospace; fill:#5ee7ff; letter-spacing:2px; }
    </style>
  </defs>

  <!-- fondo -->
  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#grid)" opacity="0.55"/>
  <rect width="1200" height="320" rx="18" fill="url(#glow)"/>

  <!-- pistas PCB (base) -->
  <g class="trace">
    <path id="t1" d="M930 112 H880 V34 H0"/>
    <path id="t2" d="M930 140 H860 V62 H760 V0"/>
    <path id="t3" d="M930 180 H850 V266 H380 V320"/>
    <path id="t4" d="M930 208 H880 V290 H0"/>
    <path id="t5" d="M1090 112 H1150 V0"/>
    <path id="t6" d="M1090 160 H1200"/>
    <path id="t7" d="M1090 208 H1140 V320"/>
  </g>

  <!-- pulsos de datos viajando por las pistas -->
  <g>
    <path class="pulse c1" d="M930 112 H880 V34 H0"/>
    <path class="pulse c2" d="M930 140 H860 V62 H760 V0"/>
    <path class="pulse c3" d="M930 180 H850 V266 H380 V320"/>
    <path class="pulse c4" d="M930 208 H880 V290 H0"/>
    <path class="pulse c2" d="M1090 112 H1150 V0"/>
    <path class="pulse c1" d="M1090 160 H1200"/>
    <path class="pulse c4" d="M1090 208 H1140 V320"/>
  </g>

  <!-- vías -->
  <circle class="via"    cx="880"  cy="34"  r="5"/>
  <circle class="via d1" cx="760"  cy="62"  r="5"/>
  <circle class="via d2" cx="850"  cy="266" r="5"/>
  <circle class="via d3" cx="380"  cy="266" r="5"/>
  <circle class="via d1" cx="880"  cy="290" r="5"/>
  <circle class="via d2" cx="1150" cy="112" r="5"/>
  <circle class="via"    cx="1140" cy="208" r="5"/>

  <!-- chip -->
  <g filter="url(#neon)">
    <g>
      <line class="pin" x1="922" y1="112" x2="930" y2="112"/>
      <line class="pin" x1="922" y1="140" x2="930" y2="140"/>
      <line class="pin" x1="922" y1="180" x2="930" y2="180"/>
      <line class="pin" x1="922" y1="208" x2="930" y2="208"/>
      <line class="pin" x1="1090" y1="112" x2="1098" y2="112"/>
      <line class="pin" x1="1090" y1="160" x2="1098" y2="160"/>
      <line class="pin" x1="1090" y1="208" x2="1098" y2="208"/>
    </g>
    <rect class="chip" x="930" y="88" width="160" height="144" rx="12"/>
  </g>
  <circle class="core" cx="1010" cy="160" r="48"/>
  <text class="chipT" x="1010" y="158" text-anchor="middle">ESP32</text>
  <text class="chipS" x="1010" y="180" text-anchor="middle">TinyML·CORE</text>

  <!-- ondas LoRa -->
  <path class="wave"    d="M992 70 Q1010 56 1028 70"/>
  <path class="wave w2" d="M980 58 Q1010 34 1040 58"/>
  <path class="wave w3" d="M968 46 Q1010 12 1052 46"/>
  <text class="lora" x="1062" y="62">LoRa</text>

  <!-- texto -->
  <text class="name" x="60" y="140" fill="url(#nameGrad)">JOSÉ MIGUEL RICO</text>
  <text class="role" x="62" y="184">CYBER SYSTEMS ENGINEERING · IoT · EMBEDDED AI · DATA</text>
  <text class="term" x="62" y="228"><tspan class="prompt">mirep68@medellin:~$</tspan> build --hardware-that-thinks <tspan class="cursor">▌</tspan></text>
</svg>
