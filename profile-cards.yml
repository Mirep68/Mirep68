name: Generar tarjetas de estadísticas

on:
  schedule:
    - cron: "0 */12 * * *"   # cada 12 horas
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-summary-cards
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          # Crea un token y guárdalo como secreto SUMMARY_GITHUB_TOKEN (ver GUIA.md)
          GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: "main"
          UTC_OFFSET: -5          # Colombia
          THEME: "tokyonight"     # solo genera este tema (más rápido y limpio)
          ANIMATION: "load"       # las tarjetas se "arman" al cargar
          NAME: "José Miguel Rico"
