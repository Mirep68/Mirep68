name: Generar snake de contribuciones

on:
  schedule:
    - cron: "0 5 * * *"   # todos los días a medianoche (hora Colombia)
  workflow_dispatch:       # botón "Run workflow" para ejecutarlo a mano
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generar SVGs del snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#00b4cc&color_dots=#ebedf0,#b8f5d9,#6be8b0,#2fd68a,#0fa86a
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#00e5ff&color_dots=#161b22,#0b3d3a,#11695f,#1fae8c,#39ff9c

      - name: Publicar en la rama "output"
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
